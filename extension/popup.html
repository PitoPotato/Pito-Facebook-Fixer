<!doctype html><html lang="en" class="popup-root"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PitoFacebookFixer</title><link rel="icon" href="icons/icon-32.png"><link rel="stylesheet" href="ui.css"><script src="ui.js" defer></script></head><body class="popup">
<header class="popup-header"><div class="brand"><span class="brand-symbol"><img src="icons/logo.svg" alt="" width="37" height="37"></span><span><strong>Pito</strong><small>FACEBOOK FIXER</small></span></div><div class="topbar-actions"><button id="languageButton" class="icon-button language-button" type="button" aria-label="Switch to Vietnamese" title="Switch to Vietnamese"><i data-lucide="languages"></i><span id="languageCode">EN</span></button><button id="themeButton" type="button" class="icon-button" aria-label="Change appearance" title="Change appearance"><i data-lucide="sun-moon"></i></button><span class="badge subtle" data-version></span></div></header>
<main><div class="popup-connection"><span class="status-dot"></span><span id="connectionText" data-i18n="connectingDots">Connecting…</span></div>
<form id="settings"><fieldset id="settingsFields" disabled><section class="panel settings-list"><label class="setting-row"><span class="row-icon"><i data-lucide="text-cursor-input"></i></span><span class="setting-copy"><strong data-i18n="popupFocus">Keep typing focus</strong><small data-i18n="popupFocusHelp">New popups won’t steal focus</small></span><input name="focusGuard" type="checkbox" role="switch" aria-label="Keep typing focus" data-i18n-aria-label="focus"></label><label class="setting-row"><span class="row-icon"><i data-lucide="rotate-cw"></i></span><span class="setting-copy"><strong data-i18n="reload">Reduce automatic refreshes</strong><small data-i18n="popupReloadHelp">Fewer interruptions on Facebook</small></span><input name="antiReload" type="checkbox" role="switch" aria-label="Reduce automatic refreshes" data-i18n-aria-label="reload"></label><label class="setting-row"><span class="row-icon"><i data-lucide="message-square-dashed"></i></span><span class="setting-copy"><strong data-i18n="popupCapture">Save recalled messages</strong><small data-i18n="popupCaptureHelp">Text, emoji, photos and voice notes</small></span><input name="archive" type="checkbox" role="switch" aria-label="Save and restore recalled messages" data-i18n-aria-label="capture"></label></section></fieldset></form>
<div class="popup-storage"><span class="section-icon"><i data-lucide="hard-drive"></i></span><div><strong id="storageUsed">—</strong><span id="storageLimit" data-i18n="readingStorage">Loading storage…</span></div><div class="popup-count"><strong id="removedCount">—</strong><span data-i18n="recalledCount">recalled messages</span></div></div><meter id="storageMeter" min="0" max="1" value="0" aria-label="Storage usage" data-i18n-aria-label="shortStorageMeter"></meter><span id="messageCount" hidden>—</span><span id="evictedCount" hidden>—</span><p id="capacityNotice" class="notice warning" role="status" hidden></p>
<div class="popup-development"><i data-lucide="eye-off"></i><span data-i18n="story">Hide story views</span><span class="badge" data-i18n="development">In development</span></div>
<button id="openOptions" class="button primary-button" type="button"><span data-i18n="openSettings">Open settings</span><i data-lucide="arrow-up-right"></i></button><p id="feedback" class="save-status" role="status" aria-live="polite" data-i18n="readingSettings">Loading settings…</p></main></body></html>
